plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.4.13' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'io.oneiros'
version = '0.5.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}


repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-webflux:3.4.13'
    api 'org.springframework.boot:spring-boot-starter-actuator:3.4.13'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'org.springframework:spring-websocket:6.2.2'
    implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'

    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    api 'org.springframework.boot:spring-boot-starter-aop:3.4.13'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Security - Password hashing (Argon2, BCrypt, SCrypt)
    implementation 'org.springframework.security:spring-security-crypto:6.4.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'

    // LZ4 Compression for backup functionality
    implementation 'org.lz4:lz4-java:1.8.0'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    // Source: https://mvnrepository.com/artifact/io.github.classgraph/classgraph
    implementation 'io.github.classgraph:classgraph:4.8.179'


    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.13'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.0'
    testImplementation 'io.projectreactor:reactor-test:3.7.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

tasks.named('test') {
    useJUnitPlatform()
    // SECURITY & COMPATIBILITY: Enable experimental support for Java 26+ in Byte Buddy/Mockito
    systemProperty 'net.bytebuddy.experimental', 'true'
}

tasks.named('jar') {
    enabled = true
}

// Maven Publishing Setup
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'oneiros-core'
            version = project.version
        }
    }
}
