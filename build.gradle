plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.4.13' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.mzxidev'
version = '0.5.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // ==== Spring Boot ====
    api 'org.springframework.boot:spring-boot-starter-webflux:4.0.4'
    api 'org.springframework.boot:spring-boot-starter-actuator:4.0.4'
    implementation 'org.springframework:spring-websocket:6.2.12'

    // ==== Jackson ====
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    // ==== Resilience4j & Caching ====
    implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // ==== Security ====
    implementation 'org.springframework.security:spring-security-crypto:6.4.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'

    // ==== Compression ====
    implementation 'org.lz4:lz4-java:1.8.0'

    // ==== Utilities ====
    implementation 'io.github.classgraph:classgraph:4.8.179'

    // ==== Lombok ====
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    // ==== Testing ====
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.13'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.0'
    testImplementation 'io.projectreactor:reactor-test:3.7.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

tasks.named('test') {
    useJUnitPlatform()
    
    // SECURITY & COMPATIBILITY: Enable experimental support for Java 26+ in Byte Buddy/Mockito
    systemProperty 'net.bytebuddy.experimental', 'true'
    
    // ADVANCED: Detailed test logging to see kernel startup and output in the console
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

// ADVANCED: Strict compiler arguments for better code quality
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-parameters" << "-Xlint:unchecked" << "-Xlint:deprecation"
}

tasks.named('jar') {
    enabled = true
}

// Ignore Javadoc errors to allow publishing
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    failOnError = false
}

// Maven Publishing Setup
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'oneiros-core'
            version = project.version

            pom {
                name = 'Oneiros Core'
                description = 'Core framework for the Oneiros ecosystem'
                url = 'https://github.com/mzxidev/oneiros-core'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'mzxidev'
                        name = 'mzxidev'
                        email = 'mzxidev@users.noreply.github.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/mzxidev/oneiros-core.git'
                    developerConnection = 'scm:git:ssh://github.com/mzxidev/oneiros-core.git'
                    url = 'https://github.com/mzxidev/oneiros-core'
                }
            }
        }
    }
    repositories {
        maven {
            name = "OSSRH"
            // New URL format for the modern Maven Central portal
            url = "https://central.sonatype.com/api/v1/publisher/maven"
            credentials {
                username = project.findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME") ?: 'dummy-username'
                password = project.findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD") ?: 'dummy-password'
            }
        }
    }
}

signing {
    def isJitPack = System.getenv("JITPACK") == "true"
    required { !isJitPack && !project.version.endsWith('-SNAPSHOT') && gradle.taskGraph.hasTask("publish") }
    // Removed useGpgCmd() to use standard internal Gradle signer via gradle.properties
    if (!isJitPack) {
        sign publishing.publications.mavenJava
    }
}
